name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: '1.4.0'
      install-policy: trusted
      coverage-path: coverage
      prepare-command: bun run build
      test-command: bun run test:unit:coverage
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      l2: true
      l2-command: bun run test:api
      l3: true
      l3-command: bun run test:e2e:bdd
      l3-browser: chromium
      worker: true
      worker-directory: .
      worker-command: bun run test:worker && bun run typecheck:worker
  release-smoke:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      yamllint: true
