name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: 1.3.6
      install-policy: blocked
      coverage-path: coverage
      prepare-command: bun run build
      test-command: bun run test:unit:coverage
      typecheck-command: bun run typecheck
      osv-config: osv-scanner.toml
      l2-command: bun run test:api
      l3-command: bun run test:e2e:bdd
      l3-browser: chromium
      worker-directory: worker
      worker-command: bun run test && bun x tsc --noEmit
      worker: true
      l2: true
      l3: true
  worker-osv:
    name: 'G2: Worker OSV'
    uses: nocoo/base-ci/.github/workflows/security.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      working-directory: worker
      lockfiles: bun.lock
      scan-secrets: false
  release-smoke:
    name: Release Workflow Smoke
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      yamllint: true
permissions:
  contents: read
